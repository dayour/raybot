name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build object model package
        run: npm run build:model

      - name: Typecheck object model
        run: npx tsc --noEmit -p packages/raybot-object-model/tsconfig.json

      - name: Typecheck site
        run: npx tsc --noEmit

      - name: Emit JSON Schemas
        run: npm run schemas

      - name: Check emitted schemas are committed
        run: git diff --exit-code -- packages/raybot-object-model/schemas static/schemas

      - name: Validate audit datasets against schemas
        run: npm run validate-data

      - name: Build site
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
