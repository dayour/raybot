<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A2A6B"/>
      <stop offset="0.55" stop-color="#1565E6"/>
      <stop offset="1" stop-color="#3A8BFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#9FD0FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9FD0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="node" x1="176" y1="176" x2="336" y2="336" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFE6FF"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- cluster edges (rays) -->
  <g stroke="#BFE0FF" stroke-width="7" stroke-linecap="round" opacity="0.9" filter="url(#soft)">
    <line x1="256" y1="256" x2="256" y2="96"/>
    <line x1="256" y1="256" x2="408" y2="168"/>
    <line x1="256" y1="256" x2="408" y2="344"/>
    <line x1="256" y1="256" x2="256" y2="416"/>
    <line x1="256" y1="256" x2="104" y2="344"/>
    <line x1="256" y1="256" x2="104" y2="168"/>
  </g>

  <!-- worker nodes -->
  <g fill="#BFE0FF" filter="url(#soft)">
    <circle cx="256" cy="96" r="26"/>
    <circle cx="408" cy="168" r="26"/>
    <circle cx="408" cy="344" r="26"/>
    <circle cx="256" cy="416" r="26"/>
    <circle cx="104" cy="344" r="26"/>
    <circle cx="104" cy="168" r="26"/>
  </g>
  <g fill="#1565E6">
    <circle cx="256" cy="96" r="11"/>
    <circle cx="408" cy="168" r="11"/>
    <circle cx="408" cy="344" r="11"/>
    <circle cx="256" cy="416" r="11"/>
    <circle cx="104" cy="344" r="11"/>
    <circle cx="104" cy="168" r="11"/>
  </g>

  <!-- head node (bot) -->
  <circle cx="256" cy="256" r="92" fill="#0A2A6B" opacity="0.35"/>
  <rect x="178" y="186" width="156" height="140" rx="42" fill="url(#node)"/>
  <!-- antenna -->
  <line x1="256" y1="186" x2="256" y2="150" stroke="#BFE0FF" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="143" r="12" fill="#BFE0FF"/>
  <!-- visor -->
  <rect x="198" y="222" width="116" height="58" rx="29" fill="#0A2A6B"/>
  <!-- eyes -->
  <circle cx="230" cy="251" r="15" fill="#5BC0FF"/>
  <circle cx="282" cy="251" r="15" fill="#5BC0FF"/>
  <circle cx="234" cy="247" r="5" fill="#FFFFFF"/>
  <circle cx="286" cy="247" r="5" fill="#FFFFFF"/>
  <!-- smile -->
  <path d="M226 300 Q256 318 286 300" stroke="#1565E6" stroke-width="9" stroke-linecap="round" fill="none"/>
</svg>
